<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sikap-Salita — FSL Live Demo</title>
  <style>
    :root {
      --bg:       #222831;
      --surface:  #393E46;
      --muted:    #948979;
      --primary:  #DFD0B8;
      --accent:   #4caf82;
      --header-h: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--primary);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 10;
    }
    .brand-icon {
      width: 34px; height: 34px;
      background: var(--accent); border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 800; font-size: 13px; letter-spacing: -.5px;
      color: #fff; flex-shrink: 0;
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-text .wordmark { font-size: 15px; font-weight: 700; letter-spacing: .08em; color: var(--primary); }
    .brand-text .tagline  { font-size: 10px; color: var(--muted); letter-spacing: .03em; }
    .spacer { flex: 1; }
    .live-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(76,175,130,.12); border: 1px solid rgba(76,175,130,.3);
      border-radius: 20px; padding: 4px 10px;
      font-size: 11px; font-weight: 600; color: var(--accent); letter-spacing: .04em;
    }
    .live-dot {
      width: 7px; height: 7px; background: var(--accent); border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
    .tag {
      background: var(--bg); border: 1px solid rgba(255,255,255,.1);
      border-radius: 6px; padding: 3px 8px; font-size: 10px; color: var(--muted); letter-spacing: .03em;
    }

    /* Language toggle */
    .lang-toggle {
      display: flex; background: var(--bg);
      border: 1px solid rgba(255,255,255,.12); border-radius: 8px; overflow: hidden;
    }
    .lang-btn {
      padding: 4px 12px; font-size: 11px; font-weight: 600; letter-spacing: .04em;
      cursor: pointer; border: none; background: transparent; color: var(--muted);
      transition: background .15s, color .15s;
    }
    .lang-btn.active { background: var(--accent); color: #fff; }

    /* ── Camera area ─────────────────────────────────────────────────── */
    .cam-wrap { position: relative; flex: 1; overflow: hidden; background: #111; }
    #cam { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
    #skeleton {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; transform: scaleX(-1);
    }

    /* ── Warmup overlay ──────────────────────────────────────────────── */
    #warmup {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: rgba(34,40,49,.65); backdrop-filter: blur(4px);
      transition: opacity .5s; pointer-events: none;
    }
    #warmup.hidden { opacity: 0; }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,.1); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #warmup-text { font-size: 13px; color: var(--muted); letter-spacing: .05em; }
    #warmup-bar-wrap { width: 180px; height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
    #warmup-bar { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width .3s ease; }

    /* ── Bottom gradient overlay ─────────────────────────────────────── */
    #overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px 32px 24px;
      background: linear-gradient(to top, rgba(34,40,49,.98) 0%, rgba(34,40,49,.85) 55%, transparent 100%);
    }

    /* Sentence strip */
    #sentence-strip { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; min-height: 38px; }
    #sentence-text {
      flex: 1; font-size: 1.1rem; font-weight: 600;
      color: var(--primary); letter-spacing: .03em;
      word-break: break-word; line-height: 1.4; min-height: 1.4em;
    }
    #sentence-text:empty::before { content: 'Sentence will appear here…'; color: var(--muted); font-weight: 400; font-size: .9rem; }
    .ctrl-btn {
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px; padding: 5px 10px; color: var(--muted);
      font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: background .15s, color .15s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.14); color: var(--primary); }
    .ctrl-btn.speak { background: rgba(76,175,130,.15); border-color: rgba(76,175,130,.35); color: var(--accent); }
    .ctrl-btn.speak:hover { background: rgba(76,175,130,.28); }
    .ctrl-btn.speak.speaking { animation: speakPulse 0.7s ease-in-out infinite alternate; }
    @keyframes speakPulse { from { opacity: 1; } to { opacity: 0.5; } }

    /* Dwell bar */
    .dwell-wrap { height: 3px; background: rgba(255,255,255,.06); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
    #dwell-bar { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width .25s linear; }

    /* Top prediction */
    .top-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
    #top-label { font-size: 2.6rem; font-weight: 800; letter-spacing: .02em; color: var(--primary); line-height: 1; }
    #top-translated { font-size: 1rem; font-weight: 500; color: var(--muted); letter-spacing: .02em; min-height: 1.2em; margin-bottom: 4px; }
    #top-badge {
      background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      padding: 3px 8px; border-radius: 4px; text-transform: uppercase;
      flex-shrink: 0; align-self: center; transition: opacity .25s;
    }
    #top-badge.hidden { opacity: 0; }
    #top-conf { margin-left: auto; font-size: 1.1rem; font-weight: 700; color: var(--accent); flex-shrink: 0; }

    .bar-wrap { height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
    .bar-fill { height: 100%; border-radius: 2px; transition: width .4s ease; }
    #top-bar { background: var(--accent); }

    /* Runner-ups */
    .alt-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .alt-label { font-size: .95rem; font-weight: 600; color: var(--muted); min-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alt-conf  { font-size: .85rem; color: var(--muted); margin-left: auto; flex-shrink: 0; }
    .alt-bar-wrap { flex: 1; height: 3px; background: rgba(255,255,255,.06); border-radius: 2px; overflow: hidden; }
    .alt-bar-fill { height: 100%; background: var(--muted); border-radius: 2px; transition: width .4s ease; }

    /* ── No camera ───────────────────────────────────────────────────── */
    #no-cam {
      position: absolute; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: var(--muted); font-size: 14px; text-align: center; padding: 32px;
    }
    #no-cam svg { opacity: .4; }
    #no-cam.visible { display: flex; }
    canvas#capture { display: none; }
  </style>
</head>
<body>

<header>
  <div class="brand-icon">SS</div>
  <div class="brand-text">
    <span class="wordmark">SIKAP-SALITA</span>
    <span class="tagline">FSL Recognition &nbsp;·&nbsp; Saint Louis University, Baguio City</span>
  </div>
  <div class="spacer"></div>
  <!-- Language toggle -->
  <div class="lang-toggle">
    <button class="lang-btn active" id="btn-lang-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn"        id="btn-lang-fil" onclick="setLang('fil')">FIL</button>
  </div>
  <div class="live-pill"><div class="live-dot"></div> LIVE</div>
  <div class="tag">SignTransformer</div>
  <div class="tag">FSL-105</div>
</header>

<div class="cam-wrap">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="skeleton"></canvas>
  <canvas id="capture"></canvas>

  <div id="warmup">
    <div class="spinner"></div>
    <div id="warmup-text">Show your hands — warming up…</div>
    <div id="warmup-bar-wrap"><div id="warmup-bar"></div></div>
  </div>

  <div id="overlay">
    <!-- Sentence strip -->
    <div id="sentence-strip">
      <div id="sentence-text"></div>
      <button class="ctrl-btn" id="btn-delete" title="Delete last word">⌫ Word</button>
      <button class="ctrl-btn" id="btn-clear"  title="Clear sentence">✕ Clear</button>
      <button class="ctrl-btn speak" id="btn-speak" title="Speak sentence">▶ Speak</button>
    </div>

    <!-- Dwell charge bar -->
    <div class="dwell-wrap"><div id="dwell-bar"></div></div>

    <!-- Top prediction -->
    <div class="top-row">
      <div id="top-label">—</div>
      <div id="top-badge" class="hidden">—</div>
      <div id="top-conf"></div>
    </div>
    <div id="top-translated"></div>
    <div class="bar-wrap"><div class="bar-fill" id="top-bar" style="width:0%"></div></div>

    <!-- Runner-ups -->
    <div class="alt-row">
      <div class="alt-label" id="alt1-label">—</div>
      <div class="alt-bar-wrap"><div class="alt-bar-fill" id="alt1-bar" style="width:0%"></div></div>
      <div class="alt-conf" id="alt1-conf"></div>
    </div>
    <div class="alt-row">
      <div class="alt-label" id="alt2-label">—</div>
      <div class="alt-bar-wrap"><div class="alt-bar-fill" id="alt2-bar" style="width:0%"></div></div>
      <div class="alt-conf" id="alt2-conf"></div>
    </div>
  </div>

  <div id="no-cam">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
      <line x1="3" y1="3" x2="21" y2="21"/>
    </svg>
    <div>Camera access denied or unavailable.<br>Please allow camera permission and reload.</div>
  </div>
</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────
  const MIN_FRAMES   = 30;
  const POLL_MS      = 150;   // inference cadence — MediaPipe ~20ms so 150ms is safe
  const JPEG_Q       = 0.7;
  const DWELL_FRAMES = 20;    // polls held before commit (~3s at 150ms each)
  const MIN_CONF     = 0.60;
  const COOLDOWN_MS  = 2000;

  // ── 105-label English → Filipino dictionary ───────────────────────────
  const FIL = {
    "GOOD MORNING":"Magandang umaga","GOOD AFTERNOON":"Magandang hapon",
    "GOOD EVENING":"Magandang gabi","HELLO":"Kumusta","HOW ARE YOU":"Kamusta ka",
    "IM FINE":"Mabuti naman ako","NICE TO MEET YOU":"Ikinagagalak kitang makilala",
    "THANK YOU":"Salamat","YOURE WELCOME":"Walang anuman","SEE YOU TOMORROW":"Hanggang bukas",
    "UNDERSTAND":"Naiintindihan","DON'T UNDERSTAND":"Hindi naiintindihan",
    "KNOW":"Alam","DON'T KNOW":"Hindi ko alam","NO":"Hindi","YES":"Oo",
    "WRONG":"Mali","CORRECT":"Tama","SLOW":"Mabagal","FAST":"Mabilis",
    "ONE":"Isa","TWO":"Dalawa","THREE":"Tatlo","FOUR":"Apat","FIVE":"Lima",
    "SIX":"Anim","SEVEN":"Pito","EIGHT":"Walo","NINE":"Siyam","TEN":"Sampu",
    "JANUARY":"Enero","FEBRUARY":"Pebrero","MARCH":"Marso","APRIL":"Abril",
    "MAY":"Mayo","JUNE":"Hunyo","JULY":"Hulyo","AUGUST":"Agosto",
    "SEPTEMBER":"Setyembre","OCTOBER":"Oktubre","NOVEMBER":"Nobyembre","DECEMBER":"Disyembre",
    "MONDAY":"Lunes","TUESDAY":"Martes","WEDNESDAY":"Miyerkules","THURSDAY":"Huwebes",
    "FRIDAY":"Biyernes","SATURDAY":"Sabado","SUNDAY":"Linggo",
    "TODAY":"Ngayon","TOMORROW":"Bukas","YESTERDAY":"Kahapon",
    "FATHER":"Tatay","MOTHER":"Nanay","SON":"Anak na lalaki","DAUGHTER":"Anak na babae",
    "GRANDFATHER":"Lolo","GRANDMOTHER":"Lola","UNCLE":"Tito","AUNTIE":"Tita",
    "COUSIN":"Pinsan","PARENTS":"Magulang",
    "BOY":"Batang lalaki","GIRL":"Batang babae","MAN":"Lalaki","WOMAN":"Babae",
    "DEAF":"Bingi","HARD OF HEARING":"Mahirap marinig",
    "WEELCHAIR PERSON":"Taong gumagamit ng wheelchair",
    "BLIND":"Bulag","DEAF BLIND":"Bingi at bulag","MARRIED":"Kasal",
    "BLUE":"Asul","GREEN":"Berde","RED":"Pula","BROWN":"Kayumanggi",
    "BLACK":"Itim","WHITE":"Puti","YELLOW":"Dilaw","ORANGE":"Kahel",
    "GRAY":"Kulay abo","PINK":"Rosas","VIOLET":"Lila","LIGHT":"Maliwanag","DARK":"Madilim",
    "BREAD":"Tinapay","EGG":"Itlog","FISH":"Isda","MEAT":"Karne","CHICKEN":"Manok",
    "SPAGHETTI":"Spaghetti","RICE":"Kanin","LONGANISA":"Longganisa","SHRIMP":"Hipon","CRAB":"Alimango",
    "HOT":"Mainit","COLD":"Malamig","JUICE":"Juice","MILK":"Gatas",
    "COFFEE":"Kape","TEA":"Tsaa","BEER":"Beer","WINE":"Alak",
    "SUGAR":"Asukal","NO SUGAR":"Walang asukal",
  };

  function translate(label) {
    return FIL[label] || label;
  }

  // ── Language state ────────────────────────────────────────────────────
  let currentLang = 'en';

  function setLang(lang) {
    currentLang = lang;
    document.getElementById('btn-lang-en').classList.toggle('active',  lang === 'en');
    document.getElementById('btn-lang-fil').classList.toggle('active', lang === 'fil');
    // Re-render sentence in new language
    renderSentence();
    // Update translation hint under current prediction
    const label = document.getElementById('top-label').textContent;
    if (label && label !== '—') showTranslated(label);
  }

  function displayText(englishLabel) {
    return currentLang === 'fil' ? (translate(englishLabel) || englishLabel) : englishLabel;
  }

  // ── Keypoint skeleton ─────────────────────────────────────────────────
  const HAND_CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17],
  ];
  const POSE_CONNECTIONS = [
    [11,13],[13,15],[12,14],[14,16],[11,12],[11,23],[12,24],[23,24],[0,11],[0,12],
  ];

  const cam        = document.getElementById('cam');
  const capture    = document.getElementById('capture');
  const skelCanvas = document.getElementById('skeleton');
  const skelCtx    = skelCanvas.getContext('2d');
  const captureCtx = capture.getContext('2d');
  const warmupEl   = document.getElementById('warmup');
  const warmupTxt  = document.getElementById('warmup-text');
  const warmupBar  = document.getElementById('warmup-bar');
  const noCam      = document.getElementById('no-cam');
  const topLabel   = document.getElementById('top-label');
  const topTrans   = document.getElementById('top-translated');
  const topBadge   = document.getElementById('top-badge');
  const topConf    = document.getElementById('top-conf');
  const topBar     = document.getElementById('top-bar');
  const alt1Label  = document.getElementById('alt1-label');
  const alt1Bar    = document.getElementById('alt1-bar');
  const alt1Conf   = document.getElementById('alt1-conf');
  const alt2Label  = document.getElementById('alt2-label');
  const alt2Bar    = document.getElementById('alt2-bar');
  const alt2Conf   = document.getElementById('alt2-conf');
  const dwellBar   = document.getElementById('dwell-bar');
  const sentenceEl = document.getElementById('sentence-text');

  // ── State ─────────────────────────────────────────────────────────────
  let polling       = false;
  let dwellLabel    = null;
  let dwellCount    = 0;
  let cooldownUntil = 0;
  let words         = [];   // English labels (translate at render time)


  // ── TTS via backend ───────────────────────────────────────────────────
  let currentAudio = null;

  async function speak(englishLabel) {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    try {
      const res = await fetch('/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: englishLabel, lang: currentLang }),
      });
      if (!res.ok) return;
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const audio = new Audio(url);
      currentAudio = audio;
      const btn = document.getElementById('btn-speak');
      audio.onplay  = () => btn.classList.add('speaking');
      audio.onended = () => { btn.classList.remove('speaking'); URL.revokeObjectURL(url); currentAudio = null; };
      audio.play();
    } catch (_) { /* network unavailable — silent fallback */ }
  }

  async function speakSentence() {
    if (words.length === 0) return;
    // Speak each word in sequence
    for (const w of words) {
      await new Promise(resolve => {
        fetch('/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: w, lang: currentLang }),
        })
        .then(r => r.blob())
        .then(blob => {
          const url   = URL.createObjectURL(blob);
          const audio = new Audio(url);
          currentAudio = audio;
          audio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; resolve(); };
          audio.play();
        })
        .catch(resolve);
      });
    }
    document.getElementById('btn-speak').classList.remove('speaking');
  }

  // ── Sentence controls ─────────────────────────────────────────────────
  function renderSentence() {
    sentenceEl.textContent = words.map(displayText).join(' ');
  }

  function commitWord(label) {
    words.push(label);
    renderSentence();
    speak(label);
  }

  document.getElementById('btn-delete').addEventListener('click', () => {
    words.pop(); renderSentence();
  });
  document.getElementById('btn-clear').addEventListener('click', () => {
    words = []; renderSentence();
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  });
  document.getElementById('btn-speak').addEventListener('click', () => {
    document.getElementById('btn-speak').classList.add('speaking');
    speakSentence();
  });

  // ── Dwell logic ───────────────────────────────────────────────────────
  function updateDwell(predictions, handsDetected) {
    if (!handsDetected || predictions.length === 0) {
      dwellLabel = null; dwellCount = 0; dwellBar.style.width = '0%'; return;
    }
    const top = predictions[0];
    if (top.confidence < MIN_CONF) {
      dwellLabel = null; dwellCount = 0; dwellBar.style.width = '0%'; return;
    }
    if (top.label !== dwellLabel) { dwellLabel = top.label; dwellCount = 1; }
    else { dwellCount++; }
    dwellBar.style.width = Math.min(dwellCount / DWELL_FRAMES * 100, 100) + '%';
    if (dwellCount >= DWELL_FRAMES && Date.now() >= cooldownUntil) {
      cooldownUntil = Date.now() + COOLDOWN_MS;
      commitWord(dwellLabel);
      dwellCount = 0; dwellBar.style.width = '0%';
    }
  }

  // ── Skeleton drawing ──────────────────────────────────────────────────
  function coverTransform() {
    const cw = skelCanvas.width, ch = skelCanvas.height;
    const vw = cam.videoWidth || cw, vh = cam.videoHeight || ch;
    const scale = Math.max(cw / vw, ch / vh);
    const dw = vw * scale, dh = vh * scale;
    return { offX: (cw - dw) / 2, offY: (ch - dh) / 2, dw, dh };
  }
  function kpXY(lm, mask, i, tf) {
    if (!mask[i]) return null;
    return { x: tf.offX + lm[i*2]*tf.dw, y: tf.offY + lm[i*2+1]*tf.dh };
  }
  function drawConns(lm, mask, conns, off, color, lw, tf) {
    skelCtx.strokeStyle = color; skelCtx.lineWidth = lw; skelCtx.lineCap = 'round';
    for (const [a,b] of conns) {
      const pa = kpXY(lm, mask, off+a, tf), pb = kpXY(lm, mask, off+b, tf);
      if (!pa || !pb) continue;
      skelCtx.beginPath(); skelCtx.moveTo(pa.x, pa.y); skelCtx.lineTo(pb.x, pb.y); skelCtx.stroke();
    }
  }
  function drawDots(lm, mask, off, n, color, r, tf) {
    skelCtx.fillStyle = color;
    for (let i=0; i<n; i++) {
      const p = kpXY(lm, mask, off+i, tf); if (!p) continue;
      skelCtx.beginPath(); skelCtx.arc(p.x, p.y, r, 0, Math.PI*2); skelCtx.fill();
    }
  }
  function drawSkeleton(lm, mask) {
    skelCanvas.width = skelCanvas.offsetWidth; skelCanvas.height = skelCanvas.offsetHeight;
    skelCtx.clearRect(0, 0, skelCanvas.width, skelCanvas.height);
    const tf = coverTransform();
    drawConns(lm, mask, POSE_CONNECTIONS, 0,  'rgba(148,137,121,0.55)', 2, tf);
    drawDots (lm, mask, 0,  25, 'rgba(148,137,121,0.7)',   3, tf);
    drawConns(lm, mask, HAND_CONNECTIONS, 25, 'rgba(76,175,130,0.85)',  2, tf);
    drawDots (lm, mask, 25, 21, '#4caf82',                 4, tf);
    drawConns(lm, mask, HAND_CONNECTIONS, 46, 'rgba(223,208,184,0.85)', 2, tf);
    drawDots (lm, mask, 46, 21, '#DFD0B8',                 4, tf);
    drawDots (lm, mask, 67, 22, 'rgba(148,137,121,0.5)',   2, tf);
  }

  // ── UI helpers ────────────────────────────────────────────────────────
  function pct(v) { return Math.round(v * 100); }

  function showTranslated(label) {
    topTrans.textContent = currentLang === 'fil' ? (translate(label) || '') : '';
  }

  function clearPredictions() {
    topLabel.textContent = '—'; topBadge.classList.add('hidden');
    topConf.textContent = ''; topBar.style.width = '0%'; topTrans.textContent = '';
    alt1Label.textContent = '—'; alt1Bar.style.width = '0%'; alt1Conf.textContent = '';
    alt2Label.textContent = '—'; alt2Bar.style.width = '0%'; alt2Conf.textContent = '';
  }

  function updateUI(data) {
    const { predictions, buffered_frames, hands_detected, landmarks, landmark_mask } = data;
    warmupBar.style.width = Math.min(buffered_frames / MIN_FRAMES, 1) * 100 + '%';
    if (landmarks && landmark_mask) drawSkeleton(landmarks, landmark_mask);
    updateDwell(predictions, hands_detected);

    if (!hands_detected) {
      warmupTxt.textContent = 'Show your hands to the camera…';
      clearPredictions(); return;
    }
    if (predictions.length === 0) {
      warmupTxt.textContent = `Warming up — ${buffered_frames}/${MIN_FRAMES} frames…`;
      clearPredictions(); return;
    }
    warmupEl.classList.add('hidden');

    const [p0, p1, p2] = predictions;
    topLabel.textContent = p0.label;
    showTranslated(p0.label);
    topBadge.textContent = p0.category; topBadge.classList.remove('hidden');
    topConf.textContent  = pct(p0.confidence) + '%';
    topBar.style.width   = pct(p0.confidence) + '%';
    if (p1) { alt1Label.textContent = displayText(p1.label); alt1Conf.textContent = pct(p1.confidence)+'%'; alt1Bar.style.width = pct(p1.confidence)+'%'; }
    if (p2) { alt2Label.textContent = displayText(p2.label); alt2Conf.textContent = pct(p2.confidence)+'%'; alt2Bar.style.width = pct(p2.confidence)+'%'; }
  }

  // ── Poll ──────────────────────────────────────────────────────────────
  async function poll() {
    if (polling) return; polling = true;
    try {
      captureCtx.drawImage(cam, 0, 0, capture.width, capture.height);
      const frame = capture.toDataURL('image/jpeg', JPEG_Q);
      const res = await fetch('/predict', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ frame }),
      });
      if (res.ok) updateUI(await res.json());
    } catch (_) { } finally { polling = false; }
  }

  // ── Skeleton render loop (30fps via rAF, independent of poll cadence) ──
  function renderLoop() {
    if (lastLandmarks && lastMask) drawSkeleton(lastLandmarks, lastMask);
    requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);

  // ── Camera init ───────────────────────────────────────────────────────
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      cam.srcObject = stream;
      cam.onloadedmetadata = () => {
        capture.width  = cam.videoWidth  || 640;
        capture.height = cam.videoHeight || 480;
        setInterval(poll, POLL_MS);
      };
    } catch (e) { noCam.classList.add('visible'); }
  }

  startCamera();
</script>
</body>
</html>
